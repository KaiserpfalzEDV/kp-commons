{{- if .Values.bitwardenSecrets.enabled }}
{{- range $s := .Values.bitwardenSecrets.secrets }}
---
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: {{ include "microservice.fullname" $ }}-{{ $s.namePostfix }}
  labels:
    {{- include "microservice.labels" $ | nindent 4 }}
    {{- with $.Values.bitwardenSecrets.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $s.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or ($.Values.bitwardenSecrets.annotations) ($s.annotations) }}
  annotations:
    {{- with $.Values.bitwardenSecrets.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $s.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    {{- toYaml $s.secretStoreRef | nindent 4 }}
  target:
    creationPolicy: {{ $s.creationPolicy }}
    deletionPolicy: {{ $s.deletionPolicy }}
    name: "{{ include "microservice.fullname" $ }}-{{ $s.namePostfix }}"
  data:
    {{- range $i := $s.items }}
    - secretKey: {{ $i.secretKey | quote }}
      remoteRef:
        conversionStrategy: {{ $s.conversionStrategy }}
        decodingStrategy: {{ $s.decodingStrategy }}
        key: {{ $i.vaultKey | quote }}
        metadataPolicy: {{ $s.metadataPolicy }}
    {{- end }}

{{ end }}
{{- end }}